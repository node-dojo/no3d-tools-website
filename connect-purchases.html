<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Blender — NO3D Tools</title><link rel="stylesheet" href="/styles.css"><style>body{min-height:100vh;margin:0;display:grid;place-items:center;background:var(--color-stone-gray);color:#050505}.connect{width:min(560px,calc(100% - 34px));border:2px solid;padding:clamp(22px,6vw,48px);box-sizing:border-box;background:#fff;box-shadow:7px 7px 0}.wordmark{display:block;width:170px;max-width:55%;margin-bottom:48px}.eyebrow{font:var(--font-size-ui) var(--font-visitor);text-transform:uppercase}.connect h1{margin:8px 0 18px;font:500 clamp(34px,8vw,62px)/.9 var(--font-druk-wide);text-transform:uppercase}.connect p{font:var(--font-size-doto-body) var(--font-doto);line-height:1.55}.connect button,.return{display:flex;width:100%;min-height:54px;align-items:center;justify-content:center;margin-top:25px;border:1px solid;background:var(--color-lello);color:#050505;font:var(--font-size-ui) var(--font-visitor);text-decoration:none;text-transform:uppercase;cursor:pointer}.return{background:#050505;color:var(--color-lello)}</style></head>
<body><main class="connect"><a href="/"><img class="wordmark" src="/assets/light/no3d-tools.png" alt="NO3D Tools"></a><span class="eyebrow">Blender connection</span><h1>Blender is ready to connect.</h1><p id="status">Checking your library connection…</p><button id="approve" hidden>Connect &amp; sync</button><a class="return" id="return" href="/account?blender=connected" hidden>Return to my library</a></main>
<script>
const code = new URLSearchParams(location.search).get('code'); const status = document.querySelector('#status'); const button = document.querySelector('#approve'); const returnLink = document.querySelector('#return');
if (!code) status.textContent = 'This connection link is incomplete. Return to Blender and try again.';
else { status.textContent = 'Allow this computer to access and sync the tools in your library.'; button.hidden = false; button.onclick = async () => { button.disabled = true; button.textContent = 'Connecting…'; const response = await fetch('/api/addon/connect/approve', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({deviceCode:code})}); if(response.ok){status.textContent = 'Your library is syncing. Return to Blender to start using your tools.';returnLink.hidden=false;}else{status.textContent = 'This connection expired or could not be approved. Return to Blender and choose Connect My Library again.';} button.hidden = true; }; }
</script></body></html>
