<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f1f0eb">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your Downloads — NO3D Prints</title>
  <link rel="stylesheet" href="/v3/styles/v3.css?v=prints-20261028b">
  <link rel="stylesheet" href="/v3/styles/print-delivery.css?v=prints-delivery-20261107">
</head>
<body class="account-entry-page print-delivery-page">
  <div class="account-entry-wash" aria-hidden="true"></div>
  <section class="account-entry-dialog" aria-labelledby="print-title">
    <header class="setup-index"><div><strong>NO3D</strong><span>Prints</span></div><a href="/v3/prints/">Browse prints</a></header>
    <div class="account-entry-body">
      <h1 id="print-title">Your downloads</h1>
      <p data-print-status role="status" aria-live="polite">Open your purchase link, or request it below.</p>
      <button class="account-entry-submit" type="button" data-print-download hidden>Download files →</button>
      <label class="print-promotion-choice" data-promotion-choice hidden><input type="checkbox" data-promotion-optin> Email me new prints and promotions</label>
      <p data-promotion-status role="status" aria-live="polite"></p>
      <form class="account-entry-form" data-print-recovery>
        <label>Purchase email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
        <button class="account-entry-submit" type="submit">Resend my downloads →</button>
      </form>
      <details data-print-preferences hidden>
        <summary>Email preferences</summary>
        <form class="print-preferences" data-print-preferences-form>
          <label><input type="checkbox" name="updates">File updates for my purchases</label>
          <label><input type="checkbox" name="promotions">New prints and promotional emails</label>
          <button class="account-entry-submit" type="submit">Save preferences →</button>
          <p data-preference-status role="status" aria-live="polite"></p>
        </form>
      </details>
    </div>
    <footer class="account-entry-foot"><img src="/assets/light/stone-logo.png" alt=""><span>No account needed</span></footer>
  </section>
  <script type="module" src="/v3/js/print-delivery.js?v=prints-delivery-20261107"></script>
</body>
</html>
